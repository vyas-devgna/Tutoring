<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" style="border-radius: 20px; overflow: visible;">
  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5b4fcf" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5b4fcf" flood-opacity="0.15"/>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="window-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f8fc"/>
    </linearGradient>
    <linearGradient id="gradient-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b4fcf"/>
      <stop offset="100%" stop-color="#8a7fff"/>
    </linearGradient>
    <linearGradient id="badge-gradient-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="badge-gradient-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="badge-gradient-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Editor Window Container -->
  <g filter="url(#shadow)">
    <!-- Main Window Background -->
    <rect x="20" y="20" width="560" height="410" rx="16" fill="#1e1e2f" stroke="#e8e6f0" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect x="20.5" y="20.5" width="559" height="45" rx="15" fill="url(#window-header)" clip-path="inset(0 0 400 0)"/>
    <line x1="20" y1="65" x2="580" y2="65" stroke="#e8e6f0" stroke-width="1"/>
    
    <!-- Title Bar Controls (macOS Dots) -->
    <circle cx="45" cy="42" r="6" fill="#ff5f56"/>
    <circle cx="65" cy="42" r="6" fill="#ffbd2e"/>
    <circle cx="85" cy="42" r="6" fill="#27c93f"/>
    
    <!-- Tab File Indicator -->
    <path d="M120 65 L135 32 A4 4 0 0 1 139 30 L250 30 A4 4 0 0 1 254 32 L269 65 Z" fill="#1e1e2f"/>
    <text x="155" y="50" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5a5c5">main.py</text>
    <!-- Close Tab (x) -->
    <path d="M235 45 L241 51 M241 45 L235 51" stroke="#5a5a7a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Tab 2 Placeholder -->
    <text x="290" y="50" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="500" fill="#9090aa">App.java</text>
  </g>

  <!-- Code Editor Body -->
  <g font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" line-height="1.6">
    <!-- Line Numbers -->
    <g fill="#4e4e6a" text-anchor="end" font-size="13">
      <text x="50" y="105">1</text>
      <text x="50" y="135">2</text>
      <text x="50" y="165">3</text>
      <text x="50" y="195">4</text>
      <text x="50" y="225">5</text>
      <text x="50" y="255">6</text>
      <text x="50" y="285">7</text>
      <text x="50" y="315">8</text>
      <text x="50" y="345">9</text>
      <text x="50" y="375">10</text>
    </g>

    <!-- Syntax Highlighted Lines -->
    <!-- Line 1: Comment -->
    <text x="75" y="105" fill="#6a9955"># Personalized Programming &amp; DSA Tutoring</text>
    
    <!-- Line 2: Function Declaration -->
    <text x="75" y="135">
      <tspan fill="#569cd6">def</tspan>
      <tspan fill="#dcdcaa"> learn_to_code</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">student</tspan><tspan fill="#ffd700">)</tspan><tspan fill="#cccccc">:</tspan>
    </text>

    <!-- Line 3: Indented Statement -->
    <text x="110" y="165">
      <tspan fill="#9cdcfe">skills</tspan>
      <tspan fill="#d4d4d4"> = </tspan>
      <tspan fill="#ffd700">[</tspan><tspan fill="#ce9178">&quot;Python&quot;</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#ce9178">&quot;Java&quot;</tspan><tspan fill="#d4d4d4">, </tspan><tspan fill="#ce9178">&quot;DSA&quot;</tspan><tspan fill="#ffd700">]</tspan>
    </text>

    <!-- Line 4: Indented Loop -->
    <text x="110" y="195">
      <tspan fill="#c586c0">for</tspan>
      <tspan fill="#9cdcfe"> skill</tspan>
      <tspan fill="#c586c0"> in</tspan>
      <tspan fill="#9cdcfe"> skills</tspan><tspan fill="#cccccc">:</tspan>
    </text>

    <!-- Line 5: Double Indented body -->
    <text x="150" y="225">
      <tspan fill="#9cdcfe">student</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">boost_confidence</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">skill</tspan><tspan fill="#ffd700">)</tspan>
    </text>
    
    <!-- Line 6: Double Indented body -->
    <text x="150" y="255">
      <tspan fill="#9cdcfe">student</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">build_resume_project</tspan><tspan fill="#ffd700">()</tspan>
    </text>

    <!-- Line 7: Empty -->
    
    <!-- Line 8: Return statement -->
    <text x="110" y="315">
      <tspan fill="#c586c0">return</tspan>
      <tspan fill="#9cdcfe"> student</tspan><tspan fill="#d4d4d4">.</tspan><tspan fill="#dcdcaa">crack_exams</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">first_attempt</tspan><tspan fill="#d4d4d4">=</tspan><tspan fill="#569cd6">True</tspan><tspan fill="#ffd700">)</tspan>
    </text>

    <!-- Line 9: Interactive Execution -->
    <text x="75" y="345">
      <tspan fill="#9cdcfe">result</tspan>
      <tspan fill="#d4d4d4"> = </tspan>
      <tspan fill="#dcdcaa">learn_to_code</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#9cdcfe">You</tspan><tspan fill="#ffd700">)</tspan>
    </text>

    <!-- Line 10: Print -->
    <text x="75" y="375">
      <tspan fill="#db5e82">print</tspan><tspan fill="#ffd700">(</tspan><tspan fill="#ce9178">&quot;Ready! Let's get started! 🚀&quot;</tspan><tspan fill="#ffd700">)</tspan>
    </text>
  </g>

  <!-- Decorative Interactive Badges -->
  <!-- Floating Python Badge (Top Right) -->
  <g transform="translate(480, 50)" filter="url(#badge-shadow)">
    <circle cx="30" cy="30" r="30" fill="url(#badge-gradient-1)"/>
    <!-- Python SVG Path (Simplified) -->
    <path d="M30 12c-4.5 0-4.8 2-4.8 3.5v3.3h5v.8h-7.3C21 19.6 19 21 19 24.3c0 3.3 1.7 4.7 3.8 4.7h2.2v-3.1c0-1.8 1.4-3.5 3.2-3.5h7.3c1.8 0 3-1.2 3-3V16c0-2.3-1.6-4-4.5-4zm4.2 12v3.1c0 1.8-1.4 3.5-3.2 3.5H23.7c-1.8 0-3 1.2-3 3V37c0 2.3 1.6 4 4.5 4 4.5 0 4.8-2 4.8-3.5v-3.3h-5v-.8h7.3c1.9 0 3.9-1.4 3.9-4.7 0-3.3-1.7-4.7-3.8-4.7h-2.2z" fill="#ffffff" opacity="0.95" transform="scale(0.8) translate(7, 7)"/>
  </g>

  <!-- Floating Braces Badge (Bottom Left) -->
  <g transform="translate(10, 310)" filter="url(#badge-shadow)">
    <circle cx="28" cy="28" r="28" fill="url(#badge-gradient-2)"/>
    <!-- Braces Icon `{}` -->
    <text x="28" y="36" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">{ }</text>
  </g>

  <!-- Floating Code / Tag Badge (Bottom Right) -->
  <g transform="translate(510, 270)" filter="url(#badge-shadow)">
    <circle cx="28" cy="28" r="28" fill="url(#badge-gradient-3)"/>
    <!-- Code angle brackets `</>` -->
    <text x="28" y="35" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
